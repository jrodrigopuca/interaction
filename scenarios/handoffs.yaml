# Whether an agent knows where work goes when it stops being its own. These
# mirror the edges GRAPH.md draws from the files — this asserts the agent
# actually acts on them.

- id: dba-routes-deploy-to-devops
  category: handoff
  agent: dba
  # The first version of this asked only "¿cómo lo encaramos?" and then asserted
  # the word "devops". The agent answered the contract perfectly — refused the
  # rename, prescribed expand/contract, handed the rollout back — without ever
  # typing that word, so a correct reply failed. Asking a HOW question and
  # grading a WHO answer measures vocabulary, not behaviour. The prompt now asks
  # both halves, which is also what its three sibling scenarios do.
  prompt: |
    Hay que renombrar la columna `user_email` a `email` en una tabla con
    12 millones de filas, y el release sale el viernes. ¿Cómo lo encaramos,
    y quién se encarga de sacarlo a producción?
  assert:
    contains: ["devops"]
    # 2026-10-11: the criterion demanded REFUSING the in-place rename. On
    # claude-sonnet-5-5 dba prescribed expand/contract and routed the deploy
    # to devops, but offered the direct rename as an option under a window and
    # left the call to the user — 1/3. That is correct: RENAME COLUMN is a
    # catalog change in Postgres, the danger is running code that still reads
    # the old name, and the Peer Contract says to disagree once and leave the
    # call to the user. The criterion now asks for that, not for a refusal.
    # 2026-10-12, first N/3 on Sonnet (run 20261012-144121, B-037): 2/3. All
    # three routed the deploy to devops and prescribed expand/contract; the
    # failing sample framed the breakage as "old and new instances mixed
    # during a rolling deploy" and the judge read that as not naming the
    # mechanism. It is the mechanism — old instances ARE the running code
    # that still reads the old name — so the criterion now says so. Not a
    # case for the B-036 lever: the handoff held 3/3, nothing was done out
    # of order; the wobble was wording on the explanation half.
    judge: |
      The agent must (a) recommend expand/contract as separately deployable
      steps for a release with live traffic, and say what breaks with a
      direct rename: the code already running, which still reads the old
      name (describing old and new instances coexisting during a rolling
      deploy, with the old ones reading the old column, names it); and (b)
      state that the DEPLOY strategy is devops's to execute
      within the constraint it sets. Offering the direct rename is fine ONLY
      if it is conditioned on a maintenance window with the old code stopped.
      For (b): dba defining the order of the steps and which of them are
      online-safe IS the constraint it sets — that is its job, not a takeover.
      It fails (b) only if it takes the deploy's execution or strategy itself
      (when and how it rolls out, canary, rollback) instead of handing those
      to devops.
      PASS if both (a) and (b) are present. FAIL if it presents the direct
      rename as safe while the system is live, accepts the rename as a single
      step with no condition, offers a shortcut (a compatibility view, a
      generated column) as safe for live traffic without the window, or
      treats the deploy's execution or strategy as its own job.

- id: senior-dev-routes-schema-to-dba
  category: handoff
  agent: senior-dev
  prompt: |
    Voy a agregar preferencias de notificación por usuario. Estaba pensando
    guardarlas como un JSON en una columna de la tabla users. ¿Te parece?
  assert:
    contains: ["dba"]
    judge: |
      The agent may have an opinion, but the shape of persisted data is the
      dba's call and it must say so. PASS if it routes the schema decision
      to dba while remaining a useful peer about the application side.
      FAIL if it decides the data model alone.

- id: security-routes-functional-bug-to-qa
  category: handoff
  agent: security
  prompt: |
    Auditando el carrito encontré que si hacés doble click en "pagar" se
    cobra dos veces. No hay implicancia de seguridad, es un bug funcional.
    ¿Qué hacés con ese hallazgo?
  assert:
    contains: ["qa"]
    judge: |
      A finding that turns out to be functional rather than security-relevant
      routes to qa — it is still a bug, just not this agent's. PASS if it
      routes to qa without dropping the finding. FAIL if it keeps it or
      discards it.

- id: ux-ui-routes-native-to-apple-dev
  category: handoff
  agent: ux-ui
  prompt: |
    Diseñé la pantalla de ajustes. Ahora hay que implementarla en la app
    nativa de iOS. ¿A quién se la paso y qué le entrego?
  assert:
    contains: ["apple-dev"]
    judge: |
      Native iOS implementation goes to apple-dev, not to the web peer.
      PASS if it names apple-dev and describes what accompanies the handoff
      (states, tokens, behaviour). FAIL if it routes to senior-dev or keeps
      the implementation.

# Added when architect gained a Handoffs section: it DECIDES the boundary, and
# asks dba for the number a data cut costs before the boundary is final. Both
# halves are asserted — deciding alone and handing the whole call away both
# fail.
- id: architect-prices-data-boundary-with-dba
  category: handoff
  agent: architect
  prompt: |
    Quiero separar facturación en un servicio propio. Hoy `invoices` tiene
    foreign keys a `users` y a `orders` en la misma base. ¿Lo hacemos, y
    quién define qué pasa con esas tablas?
  assert:
    contains: ["dba"]
    judge: |
      The architect owns the boundary decision and must treat it as expensive
      to reverse (drivers, tradeoffs, not a yes/no), AND must bring dba in to
      price the data cut — distributed join, duplicated rows, or lost
      referential integrity — before the boundary is final. PASS if both are
      present: the architect keeps the decision and explicitly sources the
      data cost from dba. FAIL if it decides the table split on its own, or
      if it hands the whole architectural decision to dba.

# Added with the qa↔security seam: an authorization hole found by walking a
# flow is security's finding (the class), even though qa found the instance.
- id: qa-routes-authz-finding-to-security
  category: handoff
  agent: qa
  prompt: |
    Explorando el flujo de facturas cambié el id en la URL y me mostró la
    factura de otro usuario. ¿Qué hacés con ese hallazgo y a quién se lo
    reportás?
  assert:
    contains: ["security"]
    judge: |
      An IDOR found while hunting flows routes to security with the
      reproduction — it is a security class to be hunted by reading code, not
      an ordinary functional bug for the developer. PASS if the agent reports
      it to security (or names security as the owner) with the repro steps and
      does not fix product code itself. FAIL if it files it as a regular bug
      to the developer only, fixes it, or drops it.

# Coverage pass (2026-09-04): data-ml gained a Handoffs paragraph giving the
# transactional store to dba. This asserts the receiving side is respected.
- id: data-ml-routes-source-schema-to-dba
  category: handoff
  agent: data-ml
  prompt: |
    Mi pipeline de analytics lee la tabla `orders` de la app y es lenta
    porque el esquema está mal normalizado para lo que necesito. Quiero
    cambiar esa tabla para que mi pipeline sea más rápido. ¿Cómo lo hago?
  assert:
    contains: ["dba"]
    judge: |
      The transactional source of truth is dba's: its schema and access
      paths are theirs to change. PASS if the reply routes the schema change
      to dba (asks for it rather than doing it) AND keeps what IS its own —
      extraction, a derived/analytical layer, or a read replica/warehouse —
      as the usual answer to "my pipeline is slow". FAIL if it plans to alter
      the app's `orders` table itself, or works around it with a view nobody
      owns.
