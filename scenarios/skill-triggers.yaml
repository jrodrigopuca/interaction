  assert:
    forbid_skills: [lh-brutal-critique]

- id: skill-brutal-critique-near-3
  category: skill-trigger
  agent: visionary
  manual: true
  # An opinion on a backlog — a plan, so lh-focus.
  prompt: |
    ¿Qué te parece nuestro backlog? Son 80 tickets y la mitad son pedidos
