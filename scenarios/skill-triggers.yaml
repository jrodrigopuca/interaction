# B-062 blind triggers (2026-10-19), written by an agent that read only the
# body of architect/skills/lh-mentoring/SKILL.md, without its frontmatter
# (description) or its When to Use section, and without this file or the
# B-062 analysis. Prompts are verbatim.

- id: skill-mentoring-blind-1
  category: skill-trigger
  agent: architect
  manual: true
  # Misconception: provider retries read as a timing problem; the missing
  # concept is idempotency (at-least-once delivery).
  prompt: |
    Che, armé un webhook en Express que recibe los pagos de Mercado Pago y en
    el handler hago todo de una: actualizo la orden a "pagada", mando el mail
    de confirmación y descuento stock. Funciona bárbaro en local, pero en
    staging vi que a veces la misma notificación llega dos o tres veces y se
    me duplican los mails y el stock queda negativo. ¿Le pongo un `setTimeout`
    de un par de segundos antes de procesar para que se "asienten" los
    reintentos, o hay una forma más prolija de esperar?
  assert:
    expect_skills: [lh-mentoring]

- id: skill-mentoring-blind-2
  category: skill-trigger
  agent: architect
  manual: true
  # Misconception: cache invalidation treated as an operations chore
  # (restart Redis) instead of a design decision that was skipped.
  prompt: |
    Estoy metiendo caché en la API de catálogo con Redis: guardo el JSON de
    cada producto con la clave `product:{id}` y sin TTL, total los productos
    casi no cambian. El problema es que cuando alguien edita un precio desde
    el backoffice, la web sigue mostrando el viejo hasta que reinicio Redis.
