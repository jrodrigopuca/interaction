# Blind cases (B-062): written from the two descriptions alone, without the
# analysis that proposed them or the scenarios above.
- id: skill-next-step-blind-1
  category: skill-trigger
  agent: generalist
  manual: true
  # blind (B-062): next-step side — dozens of fix/re-run cycles with heavy test output will outlast the context, so state must live in a file from the start
  # That blind rationale no longer holds: without "y tarda como 40 minutos"
  # (dropped below) the task fits in one session, so "outlast the context" is
  # not why the skill should load. The reasons that hold now come from the
  # fixture, so from here on this case is NOT blind: (1) a step surprises —
  # fixing the money format uncovers three more failures that were hidden
  # behind it (verified on the fixture); (2) a product decision has to be
  # escalated — password minimum 12 in config vs 8 in the tests, and the
  # prompt itself says to stop only for those; (3) it closes a multi-step
  # task, where the skill loads before ending the turn.
  # budget 6: six root causes, each a fix plus a re-run with ~210 KB of
  #   output; about five times the worst single-agent editing sample ($1.21).
  #   A sample cut before the skill loads is ERROR, not FAIL, so a tighter
  #   cap would buy unmeasured samples, and a looser one buys nothing.
  # observe: config/auth.json and the password test left unchanged = it
  #   stopped at the product decision instead of "fixing" the policy on either
  #   side (architect: the best behavioural check in the batch). No
  #   expect_files for a state file: the prompt asks for green tests and a
  #   heads-up, not a note, and with the 40 minutes gone nothing requires
  #   the state to live on disk.
  # Fixture added after run 20261014-094129 (empty workspace): 2321 tests, 89
  # failing across auth, reportes, export, notificaciones and shared (inventario
  # green); ~210 KB of output per full run. Six root causes, two of which hide
  # behind a third (money format), and one is a product decision (password
  # minimum 12 in config vs 8 in the tests). Text change: dropped "y tarda como
  # 40 minutos" — the fixture suite runs in under a second and the sample has a
  # 600 s ceiling; everything else is the author's text.
  workspace: fixtures/failing-suite
  timeout: 600
  budget: 6
  prompt: |
    Che, la suite completa del repo tiene unos 2300 tests. Ahora mismo hay alrededor de 90 fallando, desparramados por casi todos los módulos (auth, reportes, exportación a CSV, notificaciones...). Quiero que los vayas arreglando todos hasta que quede en verde: corré, mirá qué falla, arreglá, volvé a correr lo afectado, y así. No te frenes a preguntarme por cada uno, avisame solo si algo es una decisión de producto. Tenés toda la tarde.
  assert:
    expect_skills: [lh-next-step]
    observe:
      unchanged_files: [config/auth.json, src/auth/password.test.mjs]

- id: skill-decomposition-blind-1
  category: skill-trigger
  agent: generalist
  manual: true
  # blind (B-062): decomposition side — change spans three systems and rests on an unchecked assumption (the CRM retries on its own), before any step has run
  # Fixture added after run 20261014-094129 (empty workspace): app, billing
  # and crm-sync over an at-least-once bus that only carries user.registered.
  # docs/crm-webhook.md shows the retries belong to the CRM's OUTGOING
  # webhooks, not to our calls, and that the CRM keys contacts by email, so an
  # upsert with the new email creates a duplicate. Billing keeps a separate
  # `billingEmail`. Text unchanged.
  # budget 3: "¿Me lo armás?" can mean code across app, billing and crm-sync
  #   plus a new event on the bus; about twice the worst single-agent editing
  #   sample ($1.21), with room to read docs/crm-webhook.md first.
  # observe: none. Building the event is what the prompt asks, so changed
  #   files are expected either way, and the outcome that matters (catching
  #   the false retry assumption and the duplicate-by-email) lives in the
  #   reply, not in a file. architect found no clean deterministic check; not
  #   inventing one.
  workspace: fixtures/email-sync
  timeout: 600
  budget: 3
  prompt: |
    Necesito que cuando un usuario cambia su email en la app, el cambio llegue también al servicio de facturación y al CRM. Hoy cada uno tiene su copia y se desincronizan. La idea sería que la app publique un evento y los otros dos lo consuman; me dijeron que el webhook del CRM ya reintenta solo si nuestra llamada falla, así que de ese lado no habría que hacer mucho. ¿Me lo armás?
  assert:
    expect_skills: [lh-decomposition]

- id: skill-decomposition-blind-2
  category: skill-trigger
  agent: generalist
  manual: true
  # blind (B-062): near-miss — phrased as "how would you approach it" but the steps are obvious, local and each reversible, so no decomposition
  prompt: |
    ¿Cómo lo encararías? En el formulario de perfil el botón dice "Enviar" y tiene que decir "Guardar". Está en `src/profile/ProfileForm.tsx` y hay un snapshot test al lado que seguro se rompe. Cambialo y dejá el test pasando.
  assert:
    forbid_skills: [lh-decomposition]

# --------------------------------------------------------------------------- #
# senior-dev / lh-react-next
# The body is stack-agnostic by rule (catalog rule 5), so this is the one
# senior-dev skill nothing in the body covers. Near-misses keep the frontend
# context and remove React, or keep React and remove component work.
# Neighbours: lh-fullstack-boundaries, lh-pairing, lh-code-health.
# --------------------------------------------------------------------------- #
- id: skill-react-next-trigger-1
  category: skill-trigger
  agent: senior-dev
  manual: true
  prompt: |
    Tengo una página de productos en Next.js (App Router) que hace el fetch
