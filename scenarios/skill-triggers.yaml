# =========================================================================== #
# B-062 (2026-10-19), designed by qa, reviewed by stark. Five skills whose
# description changes or that never loaded.
#
# THE HOST'S OWN SKILLS (user's criterion, 2026-10-19). Our skill is a row of
# the agent's Skills table: when the request fits its trigger, OURS has to
# load. A host skill (Claude Code ships code-review, simplify, verify…) loaded
# AS WELL is valid; loaded INSTEAD of ours is the failure to find. No host
# name is written here: every trigger sample is classified by run.py into
# ours+host / ours / host / none (skill_cell, from host_skills = loaded minus
# the catalog's names), printed at the end of the run and shown per sample by
# viz.py. `expect_skills` already ignores extra skills, so the verdict did not
# change; the cell is what tells "host instead" from "nothing loaded".
#
# BLINDNESS. The mentoring prompts were written by qa WITH the new
# description in view, and borrow its words ("la semana que viene" ~ "will
# need soon", "estándar del equipo" ~ "hurt repeatedly", near-2 ~ "Not for
# simple questions"): they guard the territory both descriptions share, and
# can flatter the new one. Three blind prompts (two triggers and a twin of
# near-1), written by an agent that read only the skill's body, go in the
# TODO slot below. code-health is blind to the new description, not the old.
# =========================================================================== #

# --------------------------------------------------------------------------- #
# architect / lh-mentoring — new description drops "an expensive decision
# being made casually", which is lh-tradeoffs'. The body already carries the
# ladder (problem → why → solution → resource), so low recall here is not by
# itself a defect (B-023). near-1 is the one case that separates the old
# description from the new. lh-tradeoffs' own block above is the regression.
# --------------------------------------------------------------------------- #
- id: skill-mentoring-trigger-1
  category: skill-trigger
