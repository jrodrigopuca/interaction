# Does each agent LOAD its skill when it should, and leave it alone when it
# shouldn't? (B-041 in the catalog's backlog.)
#
# A skill's `description:` is a classifier with two faces, and B-023 only
# measured one of them. Recall: the skill loads on the queries its trigger
# names. Precision: it does NOT load on a near-miss — a query from the same
# domain, sent to the same owning agent, that a hurried reader would confuse
# with the trigger. A description that said "load always" would ace recall and
# nobody would notice; only the near-misses can catch it.
#
# SHAPE
#
#   one skill per agent, all 15 agents          15 skills
#   + visionary/lh-brutal-critique              16 skills
#   4 triggers  → expect_skills: [skill]        67 scenarios (focus 5, zero-to-one 6)
#   4 near-misses → forbid_skills: [skill]      66 scenarios (zero-to-one 6)
#
# Six skills were fixed by the backlog because B-023 already measured them:
# dba/lh-migrations, architect/lh-tradeoffs, security/lh-threat-modeling,
# product-manager/lh-discovery, qa/lh-flow-hunting, data-ml/lh-llm-integration.
# The other nine were chosen as the skill with the most concrete trigger and the
# LEAST cover in the agent's body — a skill whose method is already restated in
# the judgment section is one the model reasonably skips, which measures the
# body, not the description.
#
# A near-miss that lands in ANOTHER skill of the same agent is fine and often
# the best kind: `forbid_skills` only forbids the skill under test, so loading
# the neighbour is a correct answer, not a failure.
#
# WHY NO JUDGE
#
# The verdict is a fact in the trace — which `Skill` calls the sample made —
# not an opinion about the reply. A judge would add cost and noise to a
# question it cannot answer better than the event stream. No `contains` /
# `matches` either: what the agent SAYS is not under test here.
#
# WHY `manual: true`
#
# 133 single-turn samples at the harness estimate of $0.15 each is ~$20 per
# pass, every time the full suite runs, to re-measure descriptions that change
# rarely. Run it on demand when a description changes:
#
#   ./run.py --category skill-trigger [--only skill-migrations]
#
# READ THE NUMBERS AS A BASELINE, NOT A TARGET. B-023 measured that the model
# often does not load what the agent's body already gives it, and the reply is
# fine anyway: low recall alone is not a defect. What gets fixed is precision —
# a skill loading where it does not belong. If a description is rewritten
# because of this file, pick it with queries OTHER than these and cite the run.
#
# Prompts are what a real user would type, in the user's register, and never
# name the skill or ask to "use a skill" — that would measure obedience, not
# the description.

# --------------------------------------------------------------------------- #
# dba / lh-migrations — fixed (B-023)
# Trigger: altering a table that holds real data, renames/drops, backfills,
# release coupled to a schema change. Neighbours: lh-data-modeling (new
# schema), lh-query-performance (slow reads).
# --------------------------------------------------------------------------- #
- id: skill-migrations-trigger-1
  category: skill-trigger
  agent: dba
  manual: true
  prompt: |
    Tenemos que renombrar la columna `email` a `email_address` en `users`,
    que tiene 40M de filas, y no podemos tener downtime. ¿Cómo lo hacemos?
  assert:
    expect_skills: [lh-migrations]

- id: skill-migrations-trigger-2
  category: skill-trigger
  agent: dba
  manual: true
  prompt: |
    En el release del viernes va una migración que agrega `status` NOT NULL
    con default 'pending' a `orders` (12M de filas), y el código nuevo ya
    lo lee. ¿Algún problema?
  assert:
    expect_skills: [lh-migrations]

- id: skill-migrations-trigger-3
  category: skill-trigger
  agent: dba
  manual: true
  prompt: |
    Hay que llenar la columna nueva `country_code` de `customers` a partir de
    `address` para todas las filas existentes, son unos 25M. ¿Cómo lo corro
    sin bloquear la tabla?
  assert:
    expect_skills: [lh-migrations]

- id: skill-migrations-trigger-4
  category: skill-trigger
  agent: dba
  manual: true
  prompt: |
    Queremos dropear la tabla `legacy_invoices`. El código nuevo ya no la lee,
    pero durante el rollout conviven pods con la versión vieja. ¿En qué orden
    lo hacemos?
  assert:
    expect_skills: [lh-migrations]

- id: skill-migrations-near-1
  category: skill-trigger
  agent: dba
  manual: true
  # New schema, no data yet: lh-data-modeling.
  prompt: |
    Diseñá la tabla nueva para preferencias de notificación por usuario:
    canal, tipo de evento y si está activada o no.
  assert:
    forbid_skills: [lh-migrations]

- id: skill-migrations-near-2
  category: skill-trigger
  agent: dba
  manual: true
  # Says "migración" but it is the FIRST one, on an empty schema: the bait is
  # lexical. Reviewing a proposed model is lh-data-modeling.
  prompt: |
    Antes de generar la primera migración de Prisma, revisame este modelo:

    model Order {
      id         Int      @id @default(autoincrement())
      customer   String
      total      Float
      status     String
      createdAt  DateTime @default(now())
    }
  assert:
    forbid_skills: [lh-migrations]

- id: skill-migrations-near-3
  category: skill-trigger
  agent: dba
  manual: true
  # Slow read against real data: lh-query-performance. The likely fix is an
  # index, which is DDL on a populated table — the finest pair in this block.
  prompt: |
    El listado de pedidos tarda 4 segundos desde que tenemos datos reales.
    La query es:

    SELECT * FROM orders WHERE customer_id = $1
    ORDER BY created_at DESC LIMIT 50;

    ¿Qué está pasando?
  assert:
    forbid_skills: [lh-migrations]

- id: skill-migrations-near-4
  category: skill-trigger
  agent: dba
  manual: true
  # Integrity under concurrency: no schema change at all.
  prompt: |
    Dos requests que descuentan stock del mismo producto al mismo tiempo nos
    están haciendo vender de más. ¿Qué nivel de aislamiento o qué lock
    necesitamos?
  assert:
    forbid_skills: [lh-migrations]

