  assert:
    forbid_skills: [lh-focus]

# --------------------------------------------------------------------------- #
# visionary / lh-brutal-critique
# The agent's main deliverable, so recall may be low for a reason B-023 knows:
# the body already carries the verdict. Trigger: judging something a user can
# EXPERIENCE — product, feature, screen, demo, prototype, pitch. Neighbours:
# lh-focus (a plan of future work, even as an opinion — the fine line) and
# lh-inspire (momentum, vision, product history). The near-misses that land
# in lh-focus are correct answers: the scenario forbids critique only.
# --------------------------------------------------------------------------- #
- id: skill-brutal-critique-trigger-1
  category: skill-trigger
  agent: visionary
  manual: true
  # A demo, no plan word anywhere. The demo is described in the prompt: the
  # first version said "te paso el link" with no link, and visionary rightly
  # refused to judge what it could not see (20261014-091525) — a scenario
  # defect, not a miss.
  prompt: |
    Hicimos la demo del asistente de viajes. Le escribís "5 días en Lisboa,
    poca plata, me gusta caminar" y en unos 10 segundos te devuelve un
    itinerario día por día: barrios, un museo gratis por día y dónde comer
    barato. No reserva nada, solo arma el plan. Para editarlo le volvés a
    escribir. Decime sin vueltas si vale la pena.
  assert:
    expect_skills: [lh-brutal-critique]

- id: skill-brutal-critique-trigger-2
  category: skill-trigger
  agent: visionary
  manual: true
  # A screen with too much in it: "cut" is tempting, but what is judged is a
  # screen, not a plan.
  prompt: |
    Esta es la pantalla de configuración: 40 opciones en una sola lista,
    ordenadas alfabéticamente, con un buscador arriba. ¿La lanzamos así?
  assert:
    expect_skills: [lh-brutal-critique]

- id: skill-brutal-critique-trigger-3
  category: skill-trigger
  agent: visionary
  manual: true
  prompt: |
    Sumamos una feature: cuando cerrás la cuenta te aparece un popup con
    cinco preguntas sobre por qué te vas. Sé brutal, ¿está bien?
  assert:
    expect_skills: [lh-brutal-critique]

- id: skill-brutal-critique-trigger-4
  category: skill-trigger
  agent: visionary
  manual: true
  # A pitch to judge, not to write — the write-it version is lh-inspire.
  prompt: |
    Este es el pitch de una línea que vamos a usar en la landing: "La
    plataforma todo-en-uno que potencia la productividad de tu equipo con
    IA". ¿Funciona o no?
  assert:
    expect_skills: [lh-brutal-critique]

- id: skill-brutal-critique-near-1
  category: skill-trigger
  agent: visionary
  manual: true
  # "Opiná" on a roadmap: an opinion asked, but on a plan — lh-focus.
  prompt: |
    Opiná de nuestro roadmap del año: rediseño del dashboard, exportar a
    PDF, modo oscuro, API pública, app de escritorio y marketplace de
    plantillas.
  assert:
    forbid_skills: [lh-brutal-critique]

- id: skill-brutal-critique-near-2
  category: skill-trigger
  agent: visionary
  manual: true
  # Names a demo, but asks what to leave out against a date — lh-focus.
  prompt: |
    La demo con el cliente es en tres semanas y todavía faltan login, pagos,
