# --------------------------------------------------------------------------- #
# generalist / lh-decomposition
# Trigger: BEFORE acting, on work whose plan can fail expensively — changes
# across several files or systems, an ordered migration or upgrade, a plan
# resting on an unchecked assumption. Exclusions in the description itself:
# obvious, reversible steps; and a step that already ran and failed or
# surprised, which is lh-next-step (the neighbour on the other side of the
# moment). A conceptual question about planning executes nothing.
# --------------------------------------------------------------------------- #
- id: skill-decomposition-trigger-1
  category: skill-trigger
  agent: generalist
  manual: true
  # Trigger: change spanning several systems, before the first step.
  prompt: |
    Quiero cambiar el nombre del campo `userId` a `accountId` en la API, el
    frontend y los eventos que mandamos a la cola. ¿Cómo lo encaramos sin
    romper nada?
  assert:
    expect_skills: [lh-decomposition]

- id: skill-decomposition-trigger-2
  category: skill-trigger
  agent: generalist
  manual: true
  # Trigger: ordered upgrade, nothing run yet.
  prompt: |
    Tenemos que subir este proyecto de Python 3.8 a 3.12; hay dependencias
    viejas y un par de extensiones en C. Armá el plan antes de tocar nada.
  assert:
    expect_skills: [lh-decomposition]

- id: skill-decomposition-trigger-3
  category: skill-trigger
  agent: generalist
  manual: true
  # Trigger: the plan rests on an assumption nobody checked.
  # Fixture: catalog API on Redis — product cache, sessions, rate limit and a
  # price-update queue. The Procfile runs `web` AND `worker`: one instance,
  # two processes, and the queue and the cache invalidation cross between
  # them. The assumption is checkable in the repo, and false where it matters.
  # budget 3: "Hacelo" invites rewriting five modules and running the tests;
  #   about twice the worst single-agent editing sample seen ($1.21) plus room
  #   for the read of Procfile and worker that the question is about.
  # observe: the three files whose state crosses the web/worker boundary —
  #   price-queue.mjs (web enqueues, worker consumes), products.mjs (web reads
  #   the cache, worker invalidates it) and worker.mjs. Checked against the
  #   fixture. Left unchanged = the agent did not move cross-process state
  #   into one process's memory. server.mjs, sessions.mjs and rate-limit.mjs
  #   are out on purpose: with one web process, moving those is defensible.
  workspace: fixtures/redis-cache
  timeout: 600
  budget: 3
  prompt: |
    Vamos a reemplazar Redis por la caché en memoria del proceso, total la
    app corre en una sola instancia. Hacelo.
  assert:
    expect_skills: [lh-decomposition]
    observe:
      unchanged_files: [src/price-queue.mjs, src/products.mjs, src/worker.mjs]

- id: skill-decomposition-trigger-4
  category: skill-trigger
  agent: generalist
  manual: true
  # Trigger: multi-system migration, before the first step. Moved from
  # skill-next-step-trigger-4 when the boundary became the moment.
  # Fixture: npm workspaces monorepo (utils → core → api) with lockfile, CI,
  # multi-stage Dockerfile and README. Measured locally: under pnpm the
  # internal `^x.y` ranges resolve to the registry instead of the workspace,
  # and once linked, api's import of @acme/utils (hoisted by npm, undeclared)
  # fails. Docker is not available to verify. pnpm is allowed so "que todo
  # siga buildeando" can be checked. Bash(npm:*) and Bash(npx:*) were already
  # in the harness allowlist, so `npx pnpm` was a path to pnpm before this
  # `allow:` too; it adds the direct call, not the capability.
  # budget 4: five artifacts to rewrite plus install and build under pnpm, and
  #   the measured breakage means at least one fix-and-rebuild cycle; roughly
  #   three times the worst single-agent editing sample ($1.21).
  # observe: none. No deterministic check separates a good migration from a
  #   bad one here (architect's review found none): every file is expected to
  #   change, and "it builds" depends on a registry the sample may not reach.
  #   Not inventing one.
  workspace: fixtures/npm-monorepo
  allow: "Bash(pnpm:*)"
  timeout: 600
  budget: 4
  prompt: |
    Pasá este monorepo de npm a pnpm: lockfile, scripts, CI, Dockerfile y
    README, y que todo siga buildeando. Arrancá.
  assert:
    expect_skills: [lh-decomposition]

- id: skill-decomposition-near-1
  category: skill-trigger
  agent: generalist
  manual: true
  # Near-miss: several steps, but obvious and each reversible.
  prompt: |
