  assert:
    forbid_skills: [lh-brutal-critique]

- id: skill-brutal-critique-near-4
  category: skill-trigger
  agent: visionary
  manual: true
  # Talks about a product users like, but asks where to go next, not whether
  # it is good — lh-inspire (or lh-focus), never a verdict.
  prompt: |
    La app ya anda y los usuarios la quieren. ¿Hacia dónde la llevamos en
    los próximos cinco años?
  assert:
    forbid_skills: [lh-brutal-critique]
