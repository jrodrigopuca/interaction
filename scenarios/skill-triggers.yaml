# --------------------------------------------------------------------------- #
# generalist / lh-next-step
# All three generalist skills are stages of the Operating Loop in the body.
# lh-next-step has the most concrete trigger (a step failed or surprised,
# resuming "lo de ayer", a task outlasting the session) AND an explicit
# exclusion in its description ("not needed when the next action is obvious
# and reversible"), so its near-misses are defined by the description itself.
# The boundary with lh-decomposition is the MOMENT: planning before the first
# step is decomposition's; after a step ran, or across sessions, is this one.
# The old trigger-4 (npm→pnpm, "Arrancá") moved to skill-decomposition-trigger-4.
#
# FIXTURES (run 20261014-094129). The cases that ask to EXECUTE ran in an
# empty workspace; the agent looked, found no code and stopped, which is
# right — with nothing to plan there is no reason to load a planning skill, so
# those failures measured the stage, not the agent. Each one now seeds a small
# repo where the request can be carried out and where planning, or keeping the
# state in a file, is the correct move. trigger-2 keeps the empty workspace on
# purpose: deciding what to do after a failed attempt does not need the code,
# so its failure there is a signal about the skill, not about the stage.
# --------------------------------------------------------------------------- #
- id: skill-next-step-trigger-1
  category: skill-trigger
  agent: generalist
  manual: true
  prompt: |
    Seguimos con lo de ayer: estábamos pasando los tests de Jest a Vitest y
    quedó por la mitad.
  assert:
    expect_skills: [lh-next-step]

- id: skill-next-step-trigger-2
  category: skill-trigger
  agent: generalist
  manual: true
  prompt: |
    Probé lo que me sugeriste, subir el timeout del cliente HTTP a 30s, y
    sigue fallando igual con ECONNRESET. ¿Y ahora?
  assert:
    expect_skills: [lh-next-step]

- id: skill-next-step-trigger-3
  category: skill-trigger
  agent: generalist
  manual: true
  prompt: |
    Del plan de upgrade de Postgres 14 a 16, los pasos 1 a 3 salieron bien,
    pero el 4 (`pg_upgrade --check`) dice que la versión de `postgis` no es
    compatible. ¿Seguimos, cambiamos el plan o paramos?
  assert:
    expect_skills: [lh-next-step]

- id: skill-next-step-trigger-4
  category: skill-trigger
  agent: generalist
  manual: true
  # Trigger: the task outlasts the session and its state must live in a file.
  # Fixture: half-migrated repo — logger in src/lib, auth and billing already
  # on it, 16 console.* calls left in 7 files. Not all of them are the same
  # move: two lines are matched by text in ops/alerts.yaml, one logs an
  # unsubscribe token, and scripts/daily-report.mjs prints a CSV to stdout on
  # purpose. A useful note says which is which; a generic TODO does not.
  # budget 2: the sample reads 7 files and writes one note; editing samples
  #   of a single agent cost $0.60-1.21 before, so the default $1 could cut it
  #   mid-note, and nothing here needs more than one write.
  # observe: the prompt asks for a file outright, so whether one was written
  #   is deterministic. The globs are note-shaped on purpose: `**/*` would
  #   also pass on an agent that migrated a few .mjs files and wrote no note.
  #   The fixture's README.md counts only if the agent edits it, which is a
  #   fair place for the note. Whether the note separates the special cases
  #   is not this check's to say.
  workspace: fixtures/console-to-logger
  budget: 2
  prompt: |
    Esto de sacar todos los `console.log` del repo y pasarlo al logger nos va
    a llevar varios días, y mañana sigo yo desde otra máquina. Dejame
    anotado en un archivo dónde quedamos y qué falta, así lo retomamos.
  assert:
    expect_skills: [lh-next-step]
    observe:
      expect_files: ["**/*.md", "**/*.txt", "**/TODO*", "**/NOTES*"]

