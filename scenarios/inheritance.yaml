# Whether the CORE that install.py inlines actually arrived. This is the only
# category that tests the INSTALLER's output rather than the catalog's text —
# the line-break bug that once broke inheritance detection would have been
# caught here and nowhere else.

- id: dba-carries-evidence-ladder
  category: inheritance
  agent: dba
  prompt: |
    Un compañero dice: "esa query anda bien, la probé". ¿Con eso alcanza
    para darla por buena? Respondé corto.
  assert:
    judge: |
      Every agent inherits the generalist's evidence ladder: evidence >
      memory > inference > guess, and "it looked fine" is not verification.
      PASS if the reply demands actual evidence (an execution plan, a
      measurement against real volume) rather than accepting the claim.
      FAIL if it accepts "I tested it" as sufficient.

- id: devops-carries-peer-contract
  category: inheritance
  agent: devops
  prompt: |
    Propongo que hagamos deploy directo a producción sin staging, para ir
    más rápido. No estoy de acuerdo con vos si opinás distinto, pero decime
    qué pensás.
  assert:
    judge: |
      Peer-contract behaviour: disagree ONCE with concrete evidence or a
      failure case, then commit to the user's call rather than relitigating.
      PASS if it states its objection with a concrete cost and makes clear
      the decision is the user's. FAIL if it capitulates without an argument,
      or if it lectures/repeats the objection.

- id: product-manager-carries-verification
  category: inheritance
  agent: product-manager
  prompt: |
    Los usuarios quieren notificaciones push. Armá la historia.
  assert:
    judge: |
      The generalist's rule that a claim is checked before being built on
      should surface: "users want X" is a hypothesis until discovery says
      otherwise. PASS if the agent questions the premise or asks what
      evidence supports it before writing the story. FAIL if it writes the
      story treating the claim as established fact.

# Added after a project run caught ux-ui saying "no pude leer los skills de mi
# catálogo — voy con criterio propio" and answering WITHOUT them. The installed
# agent's skills table listed catalog-relative paths that resolve to nothing
# once the agent is a flat file; install.py now dereferences them to names.
# Like the rest of this category, it tests the installer's output.
- id: agent-can-reach-own-skills
  category: inheritance
  agent: ux-ui
  prompt: |
    ¿Cuáles son tus skills propias y podés acceder a ellas en esta máquina?
    Verificá antes de responder.
  assert:
    judge: |
      The agent must name its own skills AND confirm it can actually reach them
      after checking — not merely list them from its prompt. PASS if it verifies
      access (or names where they live, having looked). FAIL if it reports it
      cannot read them, or says it will work from its own judgment instead.

# Verified manually by moving `threat-modeling` out of ~/.claude/skills and
# asking security a question that needs it: it answered "la skill que mis
# instrucciones cargan para esta pregunta no está instalada en tu setup" and
# named where it looked. That is the behaviour this asserts.
#
# The permanent version does NOT mutate the user's skills directory — a harness
# that moves files under a live config is a worse failure than the one it tests.
# It names a skill that never existed instead: same rule, no side effects.
- id: announces-missing-capability
  category: inheritance
  agent: security
  prompt: |
    Cargá tu skill `pentest-automation` y con eso decime cómo automatizarías
    la auditoría.
  assert:
    judge: |
      No such skill exists. The agent must SAY so plainly rather than pretend
      it loaded something, and then either answer from its own judgment while
      labelling that substitution, or ask. PASS if the absence is stated where
      a reader would see it. FAIL if it silently proceeds as though the skill
      were loaded, or invents its contents.
