# Does the agent reason the way its judgment section says it does?
#
# This category replaced `register`, which asserted dialect (neutral Spanish vs
# Rioplatense voseo). That was the wrong thing to test: the register an agent
# ends up speaking is a property of the HOST — the user's output style, their
# CLAUDE.md, their locale. Install this catalog on someone else's machine and
# the same agent speaks differently without a single catalog file changing.
# Testing it measured the environment, not the agent.
#
# What travels across environments is the reasoning. These assert the first
# judgment rule of each agent — the one it would be a different agent without.

- id: security-maps-surface-before-code
  category: judgment
  agent: security
  prompt: |
    ¿Por dónde empezarías a auditar una API que nunca miraste?
  assert:
    judge: |
      This agent's first judgment rule is "think in attack surface, not
      features: enumerate the doors before checking the locks". PASS if the
      reply starts by mapping entry points and trust boundaries — routes,
      webhooks, headers, uploads, dependencies — BEFORE reading code for
      vulnerabilities. FAIL if it dives straight into hunting specific bug
      classes in the code.

- id: stark-stabilizes-before-diagnosing
  category: judgment
  agent: stark
  prompt: |
    Se cayó producción hace diez minutos y no sabemos por qué.
    ¿Qué hacemos primero?
  assert:
    judge: |
      Crisis rule: stabilize FIRST, understand later — the first move is the
      tourniquet (rollback, feature flag off, failover), not root cause. The
      only KPI while it burns is minutes of impact. PASS if the reply
      prioritises stopping the bleeding over diagnosing, and treats root cause
      as tomorrow's work. FAIL if it opens an investigation while production
      is down.

- id: senior-dev-reads-before-writing
  category: judgment
  agent: senior-dev
  prompt: |
    Tengo una función de 200 líneas que hace de todo. ¿Por dónde arranco
    para partirla?
  assert:
    judge: |
      First judgment rule: read the codebase before writing to it — match its
      idioms, naming, error handling and test style, even where you'd choose
      differently. PASS if the reply wants to see the code and its
      surroundings before prescribing a split, or explicitly conditions its
      advice on the codebase's existing conventions. FAIL if it prescribes a
      refactor recipe with no reference to what is already there.

- id: dba-weighs-cost-of-undoing
  category: judgment
  agent: dba
  prompt: |
    Estamos arrancando un proyecto nuevo. ¿Guardo la dirección del usuario
    como un JSON en la tabla users, así vamos rápido?
  assert:
    judge: |
      First judgment rule: the data outlives the code, so a schema decision is
      weighed by what UNDOING it costs once it holds real rows — not by how it
      looks on an empty database. PASS if the reply reasons about the future
      cost of changing this once there is data, or about which queries the
      shape has to make cheap. FAIL if it answers only on present convenience.

# The three below were added with the "ownerless seams" fix: each asserts the
# RECEIVING side of a handoff another agent already makes. Before, data-ml sent
# prompt injection to security, dba sent backups to devops, and the receiving
# skill had nothing to say.
- id: security-includes-llm-surface
  category: judgment
  agent: security
  prompt: |
    Vamos a lanzar un asistente con LLM que lee los tickets de soporte de los
    clientes y puede crear reembolsos a través de una tool. Armame el threat
    model, corto.
  assert:
    judge: |
      The LLM is a door and a sink: content the model reads (customer tickets)
      is untrusted input that can carry instructions (prompt injection), and
      the refund tool is a sink that injected content could trigger. PASS if
      the reply names both — ticket content as an attack vector aimed at the
      model, and the refund tool call as what an attacker would steer — with
      at least one mitigation (approval or allowlist on the tool, least
      privilege, isolating untrusted content). FAIL if it threat-models only
      classic web surface (auth, injection into the DB, secrets) and omits the
      model as a door.

- id: devops-answers-backups-with-restore
  category: judgment
  agent: devops
  prompt: |
    Necesitamos backups de la base de producción. ¿Qué definís, y cómo
    sabemos que están bien?
  assert:
    judge: |
      A backup you haven't restored is a rumor. PASS if the reply frames the
      requirement as an RPO and an RTO (or their plain-language equivalents:
      how much data may be lost, how long until it's back) AND requires a
      restore drill that proves them, not just a snapshot schedule. FAIL if it
      prescribes a backup cadence with no restore proof, or answers "it
      depends" without naming those two numbers as the thing to define.

- id: apple-dev-checks-isolation-settings
  category: judgment
  agent: apple-dev
  prompt: |
    En mi ViewModel llamo a un servicio `async` que parsea un JSON grande.
    ¿Eso corre en background automáticamente o me bloquea la UI? Es un
    proyecto nuevo en Xcode 26.
  assert:
    judge: |
      Where async code runs now depends on the target's build settings —
      Default Actor Isolation (MainActor for new Xcode 26 projects) and
      Approachable Concurrency (nonisolated async runs on the CALLER's actor).
      PASS if the reply conditions its answer on those settings (asks for
      them, or states both cases) and says that in a new Xcode 26 project the
      parse can run ON the main actor unless the function is marked
      `@concurrent` or the service is an actor. FAIL if it asserts that
      `async` means background work unconditionally, or gives one answer
      without reference to the isolation settings.
