# ux-ui #5: "Accessibility is a constraint, not a coat of paint", and #6:
# taste labelled as taste. The fixture's help text and placeholders are
# #9a9a9a on white (2.8:1); it also has taste-level oddities (a serif body,
# a 40px title, mixed radii) that a reviewer may or may not like.
