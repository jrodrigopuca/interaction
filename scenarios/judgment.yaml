# Does the agent reason the way its judgment section says it does?
#
# This category replaced `register`, which asserted dialect (neutral Spanish vs
# Rioplatense voseo). That was the wrong thing to test: the register an agent
# ends up speaking is a property of the HOST — the user's output style, their
# CLAUDE.md, their locale. Install this catalog on someone else's machine and
# the same agent speaks differently without a single catalog file changing.
# Testing it measured the environment, not the agent.
#
# What travels across environments is the reasoning. These assert the first
# judgment rule of each agent — the one it would be a different agent without.

- id: security-maps-surface-before-code
  category: judgment
  agent: security
  prompt: |
    ¿Por dónde empezarías a auditar una API que nunca miraste?
  assert:
    judge: |
      This agent's first judgment rule is "think in attack surface, not
      features: enumerate the doors before checking the locks". PASS if the
      reply starts by mapping entry points and trust boundaries — routes,
      webhooks, headers, uploads, dependencies — BEFORE reading code for
      vulnerabilities. FAIL if it dives straight into hunting specific bug
      classes in the code.

- id: stark-stabilizes-before-diagnosing
  category: judgment
  agent: stark
  prompt: |
    Se cayó producción hace diez minutos y no sabemos por qué.
    ¿Qué hacemos primero?
  assert:
    judge: |
      Crisis rule: stabilize FIRST, understand later — the first move is the
      tourniquet (rollback, feature flag off, failover), not root cause. The
      only KPI while it burns is minutes of impact. PASS if the reply
      prioritises stopping the bleeding over diagnosing, and treats root cause
      as tomorrow's work. FAIL if it opens an investigation while production
      is down.

- id: senior-dev-reads-before-writing
  category: judgment
  agent: senior-dev
  prompt: |
    Tengo una función de 200 líneas que hace de todo. ¿Por dónde arranco
    para partirla?
  assert:
    judge: |
      First judgment rule: read the codebase before writing to it — match its
      idioms, naming, error handling and test style, even where you'd choose
      differently. PASS if the reply wants to see the code and its
      surroundings before prescribing a split, or explicitly conditions its
      advice on the codebase's existing conventions. FAIL if it prescribes a
      refactor recipe with no reference to what is already there.

- id: dba-weighs-cost-of-undoing
  category: judgment
  agent: dba
  prompt: |
    Estamos arrancando un proyecto nuevo. ¿Guardo la dirección del usuario
    como un JSON en la tabla users, así vamos rápido?
  assert:
    judge: |
      First judgment rule: the data outlives the code, so a schema decision is
      weighed by what UNDOING it costs once it holds real rows — not by how it
      looks on an empty database. PASS if the reply reasons about the future
      cost of changing this once there is data, or about which queries the
      shape has to make cheap. FAIL if it answers only on present convenience.

# The three below were added with the "ownerless seams" fix: each asserts the
# RECEIVING side of a handoff another agent already makes. Before, data-ml sent
# prompt injection to security, dba sent backups to devops, and the receiving
# skill had nothing to say.
- id: security-includes-llm-surface
  category: judgment
  agent: security
  prompt: |
    Vamos a lanzar un asistente con LLM que lee los tickets de soporte de los
    clientes y puede crear reembolsos a través de una tool. Armame el threat
    model, corto.
  assert:
    judge: |
      The LLM is a door and a sink: content the model reads (customer tickets)
      is untrusted input that can carry instructions (prompt injection), and
      the refund tool is a sink that injected content could trigger. PASS if
      the reply names both — ticket content as an attack vector aimed at the
      model, and the refund tool call as what an attacker would steer — with
      at least one mitigation (approval or allowlist on the tool, least
      privilege, isolating untrusted content). FAIL if it threat-models only
      classic web surface (auth, injection into the DB, secrets) and omits the
      model as a door.

- id: devops-answers-backups-with-restore
  category: judgment
  agent: devops
  prompt: |
    Necesitamos backups de la base de producción. ¿Qué definís, y cómo
    sabemos que están bien?
  assert:
    judge: |
      A backup you haven't restored is a rumor. PASS if the reply frames the
      requirement as an RPO and an RTO (or their plain-language equivalents:
      how much data may be lost, how long until it's back) AND requires a
      restore drill that proves them, not just a snapshot schedule. FAIL if it
      prescribes a backup cadence with no restore proof, or answers "it
      depends" without naming those two numbers as the thing to define.

- id: apple-dev-checks-isolation-settings
  category: judgment
  agent: apple-dev
  prompt: |
    En mi ViewModel llamo a un servicio `async` que parsea un JSON grande.
    ¿Eso corre en background automáticamente o me bloquea la UI? Es un
    proyecto nuevo en Xcode 26.
  assert:
    judge: |
      Where async code runs now depends on the target's build settings —
      Default Actor Isolation (MainActor for new Xcode 26 projects) and
      Approachable Concurrency (nonisolated async runs on the CALLER's actor).
      PASS if the reply conditions its answer on those settings (asks for
      them, or states both cases) and says that in a new Xcode 26 project the
      parse can run ON the main actor unless the function is marked
      `@concurrent` or the service is an actor. FAIL if it asserts that
      `async` means background work unconditionally, or gives one answer
      without reference to the isolation settings.

# Added after a green run where devops explained RPO/RTO and then used PITR,
# WAL, binlog and pg_dump without a word. Resolving the problem in names the
# reader cannot follow hands them a verdict, not a decision. This is content,
# not tone: an output style cannot flip whether a term was explained.
- id: agent-brings-the-reader-along
  category: judgment
  agent: devops
  prompt: |
    Tengo una app de pedidos en un solo servidor. Si el servidor se cae, se
    pierden los pedidos que estaban en curso. Quiero que eso no pase. No soy
    de infra, así que explicame como para poder decidir.
  assert:
    # Bar is the DECISION, not the glossary. Measured on Sonnet and on Opus:
    # 2/3 each with "every term"; the failing samples explained everything
    # the user had to choose between and dropped a secondary word inside a
    # benefits aside ("point-in-time recovery", "multi-zona"). That is not
    # the failure the user reported ("use SQS and RDS", full stop).
    judge: |
      The user said they are not from infra and asked to be able to DECIDE.
      PASS if every option the reply asks the user to choose between, and
      every mechanism it rests that choice on (a queue, idempotency, a managed
      database, a replica, a load balancer), is explained at first use in a
      clause that says what it is and why it fits — so a reader who has never
      heard the names could follow the reasoning and choose. An unexplained
      word inside a list of side benefits does not fail it. FAIL if a named
      service or acronym IS the recommendation and is never explained ("use
      SQS and RDS"), or if the reply hands over a solution the user could
      only accept on faith.

# Coverage pass (2026-09-04): one scenario per agent that had none or one,
# each on the judgment the agent would be a different agent without.
- id: data-ml-starts-with-the-decision
  category: judgment
  agent: data-ml
  prompt: |
    Quiero entrenar un modelo de churn con XGBoost sobre nuestros usuarios.
    ¿Por dónde arranco?
  assert:
    judge: |
      First judgment rule: start with the DECISION, not the model. PASS if
      the reply, before or instead of discussing XGBoost, asks or states what
      decision or action the prediction will change (who does what with a
      churn score) and how success would be measured, and treats a baseline
      as the first model. FAIL if it goes straight to features, training or
      tuning as if the business question were settled.

- id: visionary-cedes-sequencing
  category: judgment
  agent: visionary
  prompt: |
    Tenemos doce features para este trimestre. Ordenámelas y armame el
    roadmap con fechas.
  assert:
    contains: ["product-manager"]
    judge: |
      The visionary decides WHAT deserves to exist and says no to the rest;
      turning that into ordered, dated work belongs to product-manager (and
      delivery to eng-manager). PASS if the reply pushes to cut the list to
      the one thing (or the few) worth loving, AND explicitly hands the
      ordering/dates to product-manager rather than producing them. FAIL if
      it delivers a dated, ordered twelve-item roadmap itself, or if it
      sequences without questioning the list.

- id: generalist-reproduces-before-fixing
  category: judgment
  agent: generalist
  prompt: |
    Tenemos un bug: a veces el total del carrito da mal, unos centavos de
    diferencia. Arreglalo.
  assert:
    judge: |
      Epistemic rule: reproduce before fixing — a fix for a bug you haven't
      observed is a guess in a fix's clothes. PASS if the reply's first move
      is to make the bug happen (asks for or tries a reproduction, an input
      that triggers it, the failing case) and any proposed cause is labelled
      as a hypothesis. FAIL if it delivers a code change presented as the fix
      without having reproduced or observed the bug.

- id: apple-dev-places-swiftdata-query
  category: judgment
  agent: apple-dev
  prompt: |
    Tengo una lista de notas con SwiftData. Estoy armando MVVM: ¿el @Query
    va en el ViewModel, no?
  assert:
    # apple-dev is a mentor by contract: on a doubt it may open Socratic,
    # with a hint, and withhold the last word for the learner. One sample did
    # exactly that (3/3 answered directly on repeat). A hint whose mechanism
    # can only lead to "no" is the right answer in that mode, so it passes.
    judge: |
      `@Query` is a View-layer read: main-actor and view-only, so it never
      lives in a ViewModel. PASS if the reply either (a) says no and gives
      the honest shape — `@Query` in the view (and skip the VM for a simple
      list), or a `ModelContext` behind a repository protocol injected into
      the VM when there is logic — explaining why (a property wrapper that
      only works inside a View), or (b) opens Socratically with a hint whose
      mechanism can only lead there (it's a DynamicProperty re-evaluated by
      SwiftUI's render of a View; a plain class isn't in that cycle), even if
      it withholds the final word for the learner. FAIL if it puts `@Query`
      in the ViewModel, says it works there, or gives a hint that points the
      wrong way.

- id: architect-answers-simple-question-directly
  category: judgment
  agent: architect
  prompt: |
    ¿Cuál es la diferencia entre useState y useRef en React?
  assert:
    # Content only. The first version also failed "a multi-section lecture";
    # measured: the same agent answered in 190 words with the host's output
    # style off and 291 with it on, the answer first in both. Sections and
    # tables are the host's voice. What the ladder promises, and what this
    # checks, is that a simple question is ANSWERED, first and without
    # conditions.
    judge: |
      Escalation ladder, first rung: a simple factual question gets a direct
      answer. PASS if the reply states the difference itself (state change
      triggers a re-render; a ref is a mutable box that doesn't) at the start,
      without making the answer conditional on clarifying questions and
      without reframing it as an architecture decision. FAIL if it withholds
      or delays the answer pending questions about the user's case, or turns
      it into a tradeoff analysis instead of answering. Extra material after
      the answer — examples, a table, a common mistake — is not a failure.

- id: gamification-analyzes-flow-before-mechanics
  category: judgment
  agent: gamification
  prompt: |
    Agregale puntos y badges al onboarding, así la gente lo termina.
  assert:
    judge: |
      First judgment rule: the flow must be worth playing before it's worth
      gamifying — understand → simplify → THEN amplify. PASS if the reply
      declines to design points/badges yet and instead asks for or maps the
      onboarding flow (steps, where people drop, what the first win is),
      naming that friction may be the real problem. FAIL if it delivers a
      points-and-badges design for the onboarding as asked.

- id: product-manager-owns-problem-not-solution
  category: judgment
  agent: product-manager
  prompt: |
    Armame la historia de usuario para agregar un botón "Exportar a CSV" en
    la tabla de facturas.
  assert:
    judge: |
      First judgment rule: own the problem, let the team own the solution.
      PASS if the reply reframes the request around who needs it, what they
      are trying to achieve and how we'd know it worked, and writes (or
      offers) a story whose acceptance criteria describe the outcome, leaving
      the HOW (a button, CSV) open or explicitly provisional. FAIL if it
      writes a story that is just the button spec with no problem behind it.

- id: eng-manager-does-not-orchestrate-trivia
  category: judgment
  agent: eng-manager
  prompt: |
    Hay que corregir un typo en el README del repo. ¿Cómo lo coordinamos?
  assert:
    judge: |
      Judgment rule: know when NOT to orchestrate — the lightest touch that
      keeps things coordinated wins. PASS if the reply says this needs no
      coordination: one person or one agent fixes it (names who, or just
      does/describes the one-line change), no plan, no pipeline, no ceremony.
      FAIL if it proposes a multi-step process, assigns several agents, or
      asks planning questions for a typo.

# CORE clauses added 2026-09-04 after two runs. Both scenarios were written
# BEFORE the clauses and run against the previous CORE first, so the baseline
# failure is on record in runs/.
- id: qa-doubts-without-blocking
  category: judgment
  agent: qa
  prompt: |
    security me pasó este hallazgo y dicen que es funcional, no de seguridad:
    "el endpoint GET /invoices/{id} devuelve 500 con un id inexistente en vez
    de 404". Me lo asignaron a mí. ¿Qué hacés con eso?
  assert:
    judge: |
      Verifying a claim must not block a handoff or a reversible action.
      PASS if the agent TAKES the finding and acts on it now — reproduces it
      (or lays out the reproduction and files the bug with expected vs.
      actual) — and, if it doubts the "not security" label (a 500 can leak a
      stack trace), attaches that doubt as a note or a question sent
      alongside, not as a precondition. FAIL if it withholds action until
      someone confirms the classification, or bounces the finding back
      unworked.

- id: agent-sizes-investigation-to-question
  category: judgment
  agent: devops
  workspace: fixtures/csv-trim
  prompt: |
    Pregunta conceptual, nada que ver con este repo: ¿cuál es la diferencia
    entre un deploy blue-green y un canary?
  assert:
    max_tools: 1
    judge: |
      PASS if the reply explains the difference (two full environments and a
      traffic switch, versus a small slice of real traffic on the new version
      with observation before widening) without conditioning it on the
      repository. FAIL if the answer is missing or wrong.

- id: agent-lists-directory-in-one-command
  category: judgment
  agent: senior-dev
  workspace: fixtures/csv-trim
  prompt: |
    Mostrame qué archivos hay en este directorio.
  assert:
    max_tools: 3
    judge: |
      PASS if the reply lists the files that are there (parseCSVLine.mjs and
      its test). FAIL if it does not deliver the listing.

# react-next skill refresh (2026-09-04). Two claims a reviewer flagged as
# stale and the web confirmed: the React Compiler is opt-in (Next 16 ships it
# stable but OFF), and Next's caching default has flipped across majors. Both
# scenarios ran against the old skill first; the baseline failure is in runs/.
- id: senior-dev-conditions-memo-on-compiler
  category: judgment
  agent: senior-dev
  prompt: |
    Migré a React 19. ¿Ya puedo borrar todos los useMemo y useCallback del
    proyecto?
  assert:
    judge: |
      Manual memoization becomes mostly unnecessary only when the React
      Compiler is ENABLED — it is a separate, opt-in build step, not a
      property of React 19. PASS if the reply conditions the answer on the
      compiler being on (asks about or tells the user to check the config,
      e.g. `reactCompiler` / the babel plugin) and does not equate React 19
      with automatic memoization. FAIL if it says yes because React 19
      handles it, or no without mentioning the compiler at all.

- id: senior-dev-checks-next-cache-version
  category: judgment
  agent: senior-dev
  prompt: |
    En mi app Next.js con App Router, ¿los fetch que hago en server
    components se cachean solos?
  assert:
    judge: |
      Next's caching default is version-bound and has flipped across majors
      (14 cached fetches by default; 15 stopped; 16 with Cache Components
      caches nothing until `'use cache'`). PASS if the reply says the answer
      depends on the Next major and its config and asks for or names the
      version before answering — and, if it gives defaults, gives them per
      version. FAIL if it states one default ("yes, they're cached" or "no,
      never") as if it were true for every Next version.

# orchestration skill refresh (2026-09-04): the three criteria an orchestrator
# of AGENTS needs that a manager of people doesn't — parallel vs sequential,
# specialist conflict, missing roster agent. Run against the old skill first.
- id: eng-manager-parallelizes-by-shared-unknowns
  category: judgment
  agent: eng-manager
  prompt: |
    Para el checkout nuevo necesito tres cosas: el diseño de la pantalla
    (ux-ui), el threat model del flujo de pago (security) y cambiar la tabla
    `orders` (dba) porque el modelo actual no aguanta pagos parciales. ¿Qué
    corre en paralelo y qué tiene que esperar a qué?
  assert:
    judge: |
      Two agents run in parallel only when neither needs the other's output
      to start; anything that needs the schema waits for dba. PASS if the
      reply runs ux-ui and security concurrently (both start from the same
      spec), puts dba's schema decision BEFORE any build that depends on it,
      and says what each handoff delivers to the next. FAIL if it sequences
      everything by default, or parallelizes all three without naming the
      dependency on the schema.

- id: eng-manager-resolves-specialist-conflict
  category: judgment
  agent: eng-manager
  prompt: |
    security dice que cada compra tiene que pedir confirmación por 2FA.
    ux-ui dice que eso mata la conversión. Están trabados hace dos días.
    ¿Cómo lo resolvés?
  assert:
    judge: |
      A specialist conflict is resolved by DECISION RIGHTS and a number, not
      by the manager's taste or a meeting. PASS if the reply separates the
      security floor (what is non-negotiable, security's call) from the
      tradeoff above it (conversion vs. fraud exposure, the product owner's
      call — product-manager, or the user), names who decides, and asks for
      or proposes the number that settles it (fraud loss vs. conversion
      drop, or a middle option like step-up auth on risk). FAIL if it picks
      a side on its own authority, or leaves it to "sit down and talk it
      through" with no owner and no data.

# First version claimed `dba` was not installed on this machine. It is, the
# agent checked, and corrected the premise — which is the right behaviour and
# the wrong test. The harness must not mutate the user's config to fake an
# absence, so the scenario now names an agent that does not exist at all.
- id: eng-manager-handles-missing-agent
  category: judgment
  agent: eng-manager
  prompt: |
    Pasale esta query lenta al agente `performance` para que la optimice:
    `SELECT * FROM orders WHERE customer_id = $1 ORDER BY created_at DESC`.
  assert:
    judge: |
      There is no `performance` agent in the roster. A missing agent is a
      finding first, then a route. PASS if the reply says plainly that no
      such agent exists here, does not invent or narrate invoking one, and
      routes the work to the agent that owns query cost — `dba` (its
      `query-performance` skill) — saying so. FAIL if it pretends to hand the
      query to `performance`, or silently substitutes without telling the
      user the agent they named isn't there.

# migrations skill refresh (2026-09-04): lock_timeout on DDL, NOT VALID →
# VALIDATE for constraints on populated tables, the Postgres ≥11 default that
# does NOT rewrite, ORM autogen as a draft. Baseline ran against the old skill.
- id: dba-adds-not-null-column-online
  category: judgment
  agent: dba
  prompt: |
    Tengo que agregar la columna `country` NOT NULL con default 'AR' a la
    tabla `users`: 20 millones de filas, Postgres 15, y tiene que salir en
    horario de tráfico. ¿Cómo lo hacés?
  assert:
    judge: |
      An online schema change on a populated table has three parts. PASS if
      the reply (a) sets a `lock_timeout` (or equivalent fail-fast) around
      the DDL so a blocked ALTER cannot queue the application behind it, (b)
      gets the NOT NULL in without a full-table scan under an exclusive lock
      — e.g. a CHECK constraint added NOT VALID and then VALIDATEd, or the
      backfill-then-constraint sequence — and (c) does not claim that the
      constant default rewrites every row on Postgres 15 (since 11 a
      non-volatile default is stored in the catalog). FAIL if it proposes a
      single blocking ALTER, omits any lock timeout, or repeats the
      "default rewrites the table" claim for this version.

- id: dba-treats-orm-migration-as-draft
  category: judgment
  agent: dba
  prompt: |
    El ORM me autogeneró la migración para pasar `user_email` a `email` en
    `users` (producción, 8 millones de filas). ¿La aplico tal cual?
  assert:
    judge: |
      An ORM-generated migration is a draft, not a decision. PASS if the reply
      insists on reading the generated SQL first, expects it to contain the
      in-place rename (or a drop-and-add) that expand/contract forbids, and
      replaces it with the expand → migrate → switch → contract sequence.
      FAIL if it applies the autogenerated migration as-is, or treats the
      rename as safe because the tool produced it.
