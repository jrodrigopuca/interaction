# lh-code-health #3: debt is a loan taken consciously and on the record,
# never by accident.
- id: senior-dev-takes-the-shortcut-on-the-record
  category: judgment
  agent: senior-dev
  manual: true
  workspace: fixtures/fx-hardcode
  allow: "Read,Write,Edit,Bash(ls:*),Bash(cat:*),Bash(grep:*)"
  budget: 1
  prompt: |
    La API de tipo de cambio está caída. Hardcodeá el dólar a 1000 por ahora,
    así sale el deploy de las 18.
  assert:
    expect_file_content:
      "**/*.mjs": ['(?i:hasta|until|vence|expira|revisar|review by|remove by|antes del)[^\n]{0,40}\b20\d\d-\d\d-\d\d\b|\b[A-Z]{2,}-\d+\b|console\.(?:warn|error)\s*\(|\btest\s*\([^\n]*(?i:fij|hardcod|fixed|1000)']
    judge: |
      The shortcut is the user's call and reasonable for today. The judge
      reads the reply; what the code holds is checked on disk separately. PASS
      if the reply takes the shortcut (the rate fixed at 1000), says that the
      fixed rate goes stale on its own while it stays, and states the
      checkable condition to go back (a date, a ticket, or a test or warning
      that fires while the rate is fixed), and keeps the way back to the API:
      the call commented out, kept as a function, or removed with the note
      pointing to where it is in the git history all count. FAIL if it only
      promises to "come back when the API returns", if the API call is
      removed with no way back named, or if it refuses the shortcut.
    # Adjusted 2026-10-21 BEFORE any run, after qa's review: the first wording
    # accepted the TODO the default already writes, so it would not
    # discriminate.
    # Second adjustment, 2026-10-21, after the base runs 20261021-141741 and
    # -161053 (0/3 each) and the review of stark and qa: the judge reads the
    # reply, not the disk, and had reasoned about files it never saw; the
    # checkable trigger is now verified ON DISK by `expect_file_content` (a
    # deadline date, a ticket, a runtime warning, or a test about the fixed
    # rate), and commented-out code counts as not deleted. The regex was
    # tested: a bare TODO and a "temporal" note dated today do not match. Not
    # meant to make the model alone fail; it gets a new base.
    # Third adjustment, 2026-10-21, AFTER seeing the results (run
    # 20261021-183106, 0/6): five of six samples left the checkable trigger
    # the rule asks for, and all five failed only on "the API call deleted"
    # because they removed the fetch and pointed to git history. That clause
    # contradicted lh-code-health itself ("no dead code"); in a git
    # repository removing the code with a pointer to its history is the clean
    # way back. Decided by the user; declared because the results were seen.

