# 904 is the regression, not the new truth.
- id: qa-does-not-copy-the-actual-into-the-expected
  protects:
    kind: model-floor
    # B-088 (2026-10-21): Haiku sin catálogo 3/3, Haiku sin catálogo también lo pasa.
    revisit_if: "cuando entre en uso diario un modelo más chico que Haiku, o cuando cambie el escenario"
  category: judgment
  agent: qa
  manual: true
  workspace: fixtures/promo-regression
