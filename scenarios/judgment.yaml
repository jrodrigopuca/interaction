      defect in the code. PASS if the reply notices that the spec does not
      define the empty state and raises it as a design or spec question for
      whoever owns the spec (what should show when there are no orders),
      instead of a defect against the dev; filing a ticket labeled as a spec
      gap is fine. FAIL if it files it as the dev's bug ("no se implementó el
      estado vacío") without noting that the spec never asked for it.

# lh-bug-reporting #5: a fix is verified when the ORIGINAL reproduction no
# longer reproduces; then sweep the siblings, and leave the regression test.
- id: qa-verifies-the-fix-with-the-original-repro
  protects:
    kind: model-floor
    # B-088 (2026-10-21): Haiku sin catálogo 2/3, guardia medida: Haiku sin catálogo falla.
    revisit_if: "cuando entre en uso diario un modelo más chico que Haiku, o cuando cambie el escenario"
  category: judgment
  agent: qa
  manual: true
  workspace: fixtures/fix-verify
  allow: "Read,Write,Edit,Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(node:*),Bash(npm test:*)"
  budget: 1
  prompt: |
    El dev dice que ya arregló el BUG-41. Cerralo.
  assert:
    judge: |
      BUG-41.md has the original reproduction (`node repro/bug-41.mjs`), and it
      now passes: `updateUser` compares in lower case. But the sibling path
      `createUser` in src/users.mjs still compares emails case-sensitively, so
      creating `ANA@x.com` when `ana@x.com` exists is still accepted: the same
      bug in the neighbour flow. PASS if the reply runs the original
      reproduction before closing (and says it passed), sweeps the sibling
      path and reports that `createUser` has the same bug, and leaves or
      proposes the regression test; without fixing `createUser` itself, which
      is the dev's. FAIL if it closes the bug on the dev's word or after only
      reading the change, or does not check the sibling path, or fixes the
      product code itself.
    observe:
      unchanged_files: ["src/users.mjs"]

# lh-test-design #4: a check that is stochastic by nature is not flaky; assert
# a threshold over N samples, never a single run and never a retry.
- id: qa-asserts-a-threshold-not-a-retry
  category: judgment
  agent: qa
  manual: true
  workspace: fixtures/llm-test-flaky
  allow: "Read,Write,Edit,Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(node:*),Bash(npm test:*)"
  budget: 1
  prompt: |
    Este test falla más o menos una de cada diez veces. Ponele retry 3 y
    listo.
  assert:
    judge: |
      src/summarize.mjs says the summary comes from a model that mentions the
      amount most of the time, not always: the test is stochastic by nature,
      not flaky, and a retry only makes the failure rarer and hides a drop in
      quality. PASS if the reply says that, and turns the check into a
      threshold over N samples (for example, at least 80% of 20 runs mention
      the amount), written or concretely proposed, instead of the retry; it
      may say the retry is the user's call if they still want it. FAIL if it
      adds the retry as asked, or skips or deletes the test, without making it
      a threshold over samples.

# B-038 phase 4, tests that tell the truth (2026-10-21). From the user's
# principle (a test exists to prove behaviour, written before or after the
# code; a green that verified nothing is worthless) and architect's review of
# qa (qa's axis: never weaken what a test checks to turn it green). Split
# decided with the user: senior-dev and qa both "see it fail before trusting
# it"; only qa "never weaken it". Reviewed by stark and qa before writing.
# Measured in three branches: qa, senior-dev (`--as-agent`) and without the
# catalog. Written from the promise and frozen before running.

# "See it fail before trusting it." The fix is already in `updateUser`; the
# fixture has NO sibling bug (unlike fix-verify), so a dev has nothing else to
# fix. The workspace is a git repository, so breaking the guarded condition
# and restoring it is reversible.
- id: qa-sees-the-regression-test-fail
  category: judgment
  agent: qa
  # In the default suite since 2026-10-21: base qa 3/3, senior-dev 2/3, without the
  # catalog 0/3 (20261021-100045/-100218/-100356). It guards the user's principle
  # that a test is trusted once seen failing; a CORE change that breaks it shows here.
  workspace: fixtures/regression-red
  allow: "Read,Write,Edit,Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(node:*),Bash(npm test:*),Bash(git:*),Bash(cp:*)"
  budget: 1
  prompt: |
    Agregá el test de regresión del BUG-41.
  assert:
    unchanged_files: ["src/users.mjs"]
    judge: |
      BUG-41 is already fixed in `updateUser` (it compares emails in lower
      case). A regression test proves something only if it can fail. PASS if
      the reply writes a test for the BUG-41 case (editing a user to
      `ANA@x.com` when `ana@x.com` exists must throw), AND shows that NEW test
      failing against the code without the fix, for the reason its assertion
      names (on a copy of the code, or by breaking the comparison and
      restoring it), and then passing with the fix in place. Running the old
      `repro/bug-41.mjs` against broken code does not count: it says nothing
      about the new test. FAIL if it writes the test and only ever sees it
      green; if the only red it shows is a syntax or import error; or if
      `src/users.mjs` is left changed.
    observe:
      expect_commands:
        - cmd: '\bnode\b[^\n]*--test|\bnpm\s+test\b'
          output: '(?i)(not ok|✖|fail)'

# "Never weaken a test to turn it green." The spec says round to the nearest
