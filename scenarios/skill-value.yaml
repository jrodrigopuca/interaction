# Is the reply BETTER because of the skill? (B-062, the value question.)
#
# skill-triggers.yaml asks whether a skill loads; it cannot say whether the
# skill is worth its description, which travels in every session. Here the
# same task runs twice: with the full catalog, and with the skill taken out
# (`ablate:`). The pair must be identical but for its id and `ablate:` —
# run.py refuses to load an `ablate:` without such a twin. No difference, and
# the skill is a candidate to merge, drop, or leave a line in the body; only
# this measurement decides that.
#
# `ablate:` takes catalog names (not copied into the workspace, and their row
# leaves every agent's Skills table) and host names (turned off through
# `skillOverrides` in the session's --settings). A sample where the ablated
# name still reaches the model — offered in the init, or read from its
# installed copy by path — is an ERROR, not a verdict.
#
# Deterministic checks run before the judge and carry the comparison while
# the judge is not calibrated against human labels (B-039). `manual: true`:
# each pair is run on demand, with its cost approved.

# --------------------------------------------------------------------------- #
# security / lh-code-audit. fixtures/audit-sort-ident (see skill-triggers.yaml).
# Narrow on purpose: the prompt names ONE endpoint. The second instance
# (users export, `fields`) is found only by hunting the class from its root
# (sqlIdent); products is the gated decoy (allowlist in productSort).
# Deterministic: the reply names the root and the second route. Judge:
# exploitability claimed for reports AND users, NOT for products.
# --------------------------------------------------------------------------- #
- &audit_value_1
  id: value-code-audit-1
  category: skill-value
  agent: security
  manual: true
  workspace: fixtures/audit-sort-ident
  budget: 2
  prompt: |
    Un cliente abrió un ticket: pegándole a /reports/export con valores raros
    en `sort` a veces recibe un 500. Antes de tratarlo como un bug común,
    ¿hay algo de seguridad ahí? El código está en este repo.
  assert:
    matches: '(?is)(?=.*sqlIdent)(?=.*(users-repo|/admin/users|pickColumns|\bfields\b))'
    judge: |
      The fixture: sqlIdent() in src/db/sql.mjs wraps an identifier in double
      quotes without escaping a double quote inside it. /reports/export
      passes `sort` unvalidated (buildListOptions) into ORDER BY via
      sqlIdent; /admin/users/export passes `fields` unvalidated (pickColumns)
      into the SELECT list via sqlIdentList; /products passes `sort` through
      the PRODUCT_SORTS allowlist first and is safe. PASS if the reply (1)
      says /reports/export is SQL-injectable through `sort` and places the
      cause in sqlIdent not escaping the quote and/or the missing allowlist,
      (2) reports /admin/users/export (`fields`) as a second instance of the
      same flaw, and (3) does not claim /products is exploitable (calling
      sqlIdent itself unsafe is fine; saying products is safe because of the
      allowlist is ideal). FAIL if it misses either vulnerable route, calls
      products exploitable, or treats the 500 as a plain functional bug.

- <<: *audit_value_1
  id: value-code-audit-1-without
  ablate: [lh-code-audit]

# --------------------------------------------------------------------------- #
# dba / lh-query-performance (tanda P6). The user proposes the WRONG column
# order (range/sort column first). dba's body says nothing about composite
# order; lh-query-performance #3 does. Deterministic: an index led by
# account_id, followed by occurred_at.
# --------------------------------------------------------------------------- #
- &qp_value_1
  id: value-query-performance-1
  category: skill-value
  agent: dba
  manual: true
  prompt: |
    Postgres 16. El listado de eventos tarda 3 s:

    SELECT * FROM events
    WHERE account_id = $1 AND occurred_at >= now() - interval '30 days'
    ORDER BY occurred_at DESC
    LIMIT 50;

    `events` tiene 80 millones de filas y unas 20 mil cuentas. Pensaba crear
    `CREATE INDEX ON events (occurred_at, account_id);`. ¿Va?
  assert:
    matches: '(?is)\(\s*account_id\s*,\s*occurred_at'
    judge: |
      PASS if the reply says the proposed order (occurred_at, account_id) is
      wrong or worse, and recommends an index led by the equality column
      account_id followed by occurred_at (DESC optional), explaining that
      equality columns go before the range/sort column so the sort and the
      range are served by the index. FAIL if it accepts the proposed order,
      recommends occurred_at first, or recommends two single-column indexes
      as the fix.

- <<: *qp_value_1
  id: value-query-performance-1-without
  ablate: [lh-query-performance]

# --------------------------------------------------------------------------- #
# Paso 4 de la revisión fechada (2026-10-22), etapa 0: una tarea contra el
# default por cada una de las seis skills en duda, escrita desde su patrón y
# revisada por qa y architect antes de congelar. Etapa 1 corre solo las ramas
# "-without" (×3): una tarea que el modelo pasa sin la skill no tiene margen y
# cierra esa skill como piso; las que fallan pasan a la etapa 2 (la rama con
# catálogo, contando la carga). Diseño de qa y data-ml: el valor es un número
# por skill, la carga se reporta aparte, y nada se borra solo por el aporte.
# Revisión de architect y qa: en cuatro tareas el cuerpo o el CORE ya llevan
# el patrón, así que un 3/3 sin la skill se registra como "cubierto por el
# cuerpo", no como piso del modelo: dice que la skill repite el cuerpo en
# esa parte, no que el modelo lo haga solo. Los workspaces son repos de git
# con el fixture commiteado (run.py), así que editar es reversible.
# --------------------------------------------------------------------------- #

# architect / lh-tradeoffs #1 (reversibility first) and #2 (drivers from the
# context, not the generic blog answer). The user frames it as a fashion
# question; the fixture has the drivers: 3 devs, one VM, 1.200 emails a day,
# the real pain is a slow provider inside the checkout request.
- &tradeoffs_value_1
  id: value-tradeoffs-1
  category: skill-value
  agent: architect
  manual: true
  workspace: fixtures/arch-notifications
  allow: "Read,Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*)"
  prompt: |
    ¿Sacamos las notificaciones a un microservicio o las dejamos en el
    monolito? Se viene WhatsApp y quiero hacerlo bien desde ahora.
  assert:
    judge: |
      The repository gives the drivers: a team of 3 (one part-time), one
      VM, no dedicated on-call, about 1,200 emails a day, and the current
      pain is the email provider slowing the checkout because it is called
      inside the request (src/checkout.js). PASS if the reply decides from
      those drivers — keeps notifications in the monolith and takes the
      send out of the checkout request with any async mechanism (a queue,
      a job table, an outbox), or argues a service from a reason drawn
      from the drivers — and states the condition that would flip the
      choice (for example a WhatsApp volume or a second team). Asking
      whoever runs operations or the data model to cost the queue is fine
      alongside a pick. FAIL if it
      compares the options in generic terms that ignore the team, the
      volume and the synchronous call, gives no recommendation, or
      recommends the service on growth it imagines rather than the numbers
      in the repository.

- <<: *tradeoffs_value_1
  id: value-tradeoffs-1-without
  ablate: [lh-tradeoffs]

# architect / lh-mentoring #1 (answer first), #3 (diagnose the gap, not the
# symptom), #6 (check that it landed). The user repeats a misconception and
# proposes the same wrong fix again.
- &mentoring_value_1
  id: value-mentoring-1
  category: skill-value
  agent: architect
  manual: true
  prompt: |
    Otra vez el loop infinito con el useEffect. La otra vez tenía `[user]`
    en el array y hacía loop, así que se lo saqué entero, y ahora tampoco
    anda:

    ```jsx
    const [user, setUser] = useState(null);
    useEffect(() => {
      fetch(`/api/users/${id}`).then(r => r.json()).then(setUser);
    });
    ```
  assert:
    judge: |
      The gap is a concept, not the symptom: the dependency array lists what
      the effect READS (`id`), not what it sets (`user`). With `[user]` the
      effect re-ran every time it set user; with no array it runs after
      every render. PASS if the reply first gives the fix (`[id]`; adding a
      cleanup or an abort is fine), then names that concept once — reads,
      not writes — and closes with one question or a tiny exercise that
      checks the user got it. FAIL if it only gives the fix, names only the
      symptom ("removing the array causes the loop") without the reads-not-
      writes rule, lectures through several unrelated concepts, or teaches
      without fixing first. Its pattern is also in architect's body (the
      fourth row of the escalation ladder): a pass without the skill is
      "covered by the body".

- <<: *mentoring_value_1
  id: value-mentoring-1-without
  ablate: [lh-mentoring]

# generalist / lh-decomposition #1: find the load-bearing unknown first. The
# plan "replace moment with dayjs in 40 files" rests on dayjs handling
# per-clinic time zones, which needs its timezone plugin and behaves
# differently around DST; src/reminders.js is the one place that depends on
# it. Read-only: the deliverable is the plan. Note (architect, 2026-10-23):
# the prompt says ~40 files and the fixture holds 8 (a sample); once the agent
# lists them, the steps look small. Kept as is — that gap is part of what a
# real repo shows a planner, not a defect to tune away.
- &decomposition_value_1
  id: value-decomposition-1
  category: skill-value
  agent: generalist
  manual: true
  workspace: fixtures/moment-migration
  allow: "Read,Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*)"
  prompt: |
    Antes de arrancar, armame el plan para migrar todo el proyecto de moment
    a dayjs. Son unos 40 archivos.
  assert:
    judge: |
      src/reminders.js uses moment-timezone (`moment.tz` with each clinic's
      zone, 9:00 local the day before); dayjs needs its utc and timezone
      plugins for that, and their behaviour around a DST change is the one
      assumption that can sink the plan. PASS if, before any mass
      replacement, the plan proves dayjs plus those plugins matches
      reminders.js (a test with a DST date, or a side-by-side comparison) —
      a cheap inventory of moment usages first is fine — and states what
      result would stop or change the plan. Listing other plugins (such as
      relativeTime for fromNow) is fine. FAIL if the mass replacement comes
      before that proof, the time-zone code is treated as one more file, or
      it never notices it.

- <<: *decomposition_value_1
  id: value-decomposition-1-without
  ablate: [lh-decomposition]

