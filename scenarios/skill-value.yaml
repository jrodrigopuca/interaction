# senior-dev / lh-pairing #1: findings, not grades — the blocker first with
# its failure case, something true and good said, style left alone unless
# asked. One real bug (the page end loses the last item) among taste-level
# differences.
- &pairing_value_1
  id: value-pairing-1
  category: skill-value
  agent: senior-dev
  manual: true
  prompt: |
    ¿Me revisás esto antes del PR?

    ```js
    function paginate(items, page, size){
      var start = page * size
      var end = start + size - 1
      return { total: items.length, items: items.slice(start, end) }
    }
    ```
  assert:
    judge: |
      `slice(start, end)` excludes `end`, so with `end = start + size - 1`
      every page returns size − 1 items: the last item of each page is
      lost. That is the blocker; `var`, missing semicolons and the brace
      style are taste. PASS if the reply leads with that bug and its failure
      case (for example, size 10 returns 9), labels anything else by
      severity with style marked as optional or left out, and does not
      rewrite the function into its own style beyond the fix. A fix
      snippet that also uses `const` or semicolons is fine unless those
      changes are presented as part of the fix; flagging that `page * size`
      assumes pages start at 0 is a legitimate risk, not taste; a "nit:"
      label counts as marked optional. FAIL if it misses the bug, leads with
      style, or presents style changes with the same weight as the bug.

- <<: *pairing_value_1
  id: value-pairing-1-without
  ablate: [lh-pairing]
