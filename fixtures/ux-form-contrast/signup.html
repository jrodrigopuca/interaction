<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <main class="card">
    <h1>Creá tu cuenta</h1>
    <form>
      <label for="name">Nombre</label>
      <input id="name" placeholder="Tu nombre completo">
      <p class="help">Como querés que te llamemos.</p>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="vos@empresa.com">
      <p class="help">Te mandamos un link para confirmar.</p>

      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Mínimo 8 caracteres">
      <p class="help">Usá letras, números y un símbolo.</p>

      <button type="submit">Crear cuenta</button>
      <a class="secondary" href="/login">Ya tengo cuenta</a>
    </form>
  </main>
</body>
</html>
