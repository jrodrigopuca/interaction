name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      # TODO: falta un chequeo de dependencias. Ojo: `npm audit` empieza a
      # fallar cuando salen advisories nuevas aunque nadie haya tocado el
      # código, y hoy nos enteramos recién en el próximo push.
